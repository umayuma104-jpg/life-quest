<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
<meta name="theme-color" content="#0f1222">
<title>Life Quest</title>
<style>
  :root {
    --bg: #0f1222; --panel: #181c33; --panel2: #20253f; --line: #2c3256;
    --text: #e8eaf6; --muted: #8d93b8; --accent: #ffcc4d; --xp: #5ee0a0;
    --str: #ff6b6b; --int: #4dabf7; --mnd: #b197fc; --vit: #69db7c;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  body { padding-bottom: 80px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, select { font: inherit; color: var(--text); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }

  /* header */
  .hero { background: linear-gradient(135deg, #262c55, #1a1e3a); border: 1px solid var(--line);
    border-radius: 16px; padding: 16px; }
  .hero-top { display: flex; align-items: center; gap: 14px; }
  .lv { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 30% 30%, #ffe08a, #f5a623); color: #3a2600;
    font-weight: 800; flex-shrink: 0; box-shadow: 0 0 18px #f5a62355; }
  .lv small { display: block; font-size: 10px; line-height: 1; text-align: center; }
  .lv b { font-size: 24px; line-height: 1; }
  .title { font-size: 13px; color: var(--accent); }
  .name { font-size: 20px; font-weight: 700; }
  .bar { height: 10px; background: #0b0e1c; border-radius: 6px; overflow: hidden; margin-top: 12px; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #38d9a9, var(--xp));
    width: 0; transition: width .6s cubic-bezier(.2,.8,.2,1); }
  .bar-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .chips { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .chip { background: #0b0e1c88; border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 10px; font-size: 13px; }

  /* today */
  h2 { font-size: 15px; color: var(--muted); margin: 22px 0 10px; display: flex; justify-content: space-between; align-items: center; }
  .progress-ring { font-size: 13px; color: var(--text); }
  .task { display: flex; align-items: center; gap: 12px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 8px;
    transition: transform .15s, border-color .2s, background .2s; }
  .task.done { border-color: #38d9a966; background: #17302a; }
  .task .ic { font-size: 26px; width: 36px; text-align: center; flex-shrink: 0; }
  .task .body { flex: 1; min-width: 0; }
  .task .tn { font-weight: 600; }
  .task .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .task .ctrl { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .check { width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--line);
    background: var(--panel2); font-size: 20px; display: grid; place-items: center; }
  .task.done .check { background: var(--xp); border-color: var(--xp); color: #0b2a1d; }
  .ctrl input[type=number] { width: 70px; text-align: right; }
  .ctrl input[type=time] { width: 110px; }
  .tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px; margin-right: 4px;
    font-weight: 700; color: #111; }
  .t-str { background: var(--str); } .t-int { background: var(--int); }
  .t-mnd { background: var(--mnd); } .t-vit { background: var(--vit); }
  .gain { color: var(--xp); font-weight: 700; }

  /* stats */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .stat { display: grid; grid-template-columns: 80px 1fr 56px; gap: 10px; align-items: center; margin: 10px 0; }
  .stat .sbar { height: 8px; background: #0b0e1c; border-radius: 4px; overflow: hidden; }
  .stat .sbar i { display: block; height: 100%; }
  .stat .sv { text-align: right; font-weight: 700; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .kpi .k { font-size: 12px; color: var(--muted); }
  .kpi .v { font-size: 22px; font-weight: 800; margin-top: 2px; }

  /* calendar */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .d { aspect-ratio: 1; border-radius: 6px; background: var(--panel2); display: grid; place-items: center;
    font-size: 11px; color: var(--muted); }
  .cal .h { font-size: 11px; color: var(--muted); text-align: center; }
  .legend { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); margin-top: 8px; justify-content: flex-end; }
  .legend span { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  /* settings */
  .edit-row { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .edit-row:last-child { border-bottom: 0; }
  .edit-row .tn { flex: 1; }
  .btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  .btn.primary { background: var(--accent); color: #3a2600; border-color: var(--accent); font-weight: 700; }
  .btn.danger { color: var(--danger); }
  .btn.sm { padding: 4px 8px; font-size: 13px; }
  .form { display: grid; gap: 8px; }
  .form label { font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); font-size: 13px; }

  /* nav */
  nav { position: fixed; bottom: 0; left: 0; right: 0; background: #0b0e1cf2; border-top: 1px solid var(--line);
    display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); backdrop-filter: blur(8px); }
  nav .in { display: flex; max-width: 560px; width: 100%; }
  nav button { flex: 1; background: none; border: 0; padding: 10px 0 12px; color: var(--muted); font-size: 11px; }
  nav button .i { display: block; font-size: 22px; }
  nav button.on { color: var(--accent); }

  /* modal & toast */
  .modal { position: fixed; inset: 0; background: #000a; display: grid; place-items: center; z-index: 50; padding: 16px; }
  .modal .box { background: var(--panel); border: 1px solid var(--accent); border-radius: 18px; padding: 28px 24px;
    text-align: center; max-width: 340px; width: 100%; animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  .modal .big { font-size: 56px; font-weight: 900; color: var(--accent); text-shadow: 0 0 24px #ffcc4d88; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: #0b2a1d;
    border: 1px solid var(--xp); color: var(--xp); padding: 8px 16px; border-radius: 999px; font-weight: 700;
    z-index: 40; animation: rise 1.4s forwards; pointer-events: none; white-space: nowrap; }
  @keyframes rise { 0% { opacity: 0; transform: translate(-50%, 10px); } 15% { opacity: 1; transform: translate(-50%, 0); }
    80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -20px); } }
</style>
</head>
<body>
<div class="wrap">
  <!-- HERO -->
  <section class="hero">
    <div class="hero-top">
      <div class="lv"><div><small>LV</small><b id="lvNum">1</b></div></div>
      <div style="flex:1;min-width:0">
        <div class="title" id="titleTxt">見習い</div>
        <div class="name" id="heroName">冒険者</div>
      </div>
    </div>
    <div class="bar"><i id="xpBar"></i></div>
    <div class="bar-label"><span id="xpTxt">0 / 100 XP</span><span id="xpNext">次のレベルまで 100</span></div>
    <div class="chips">
      <span class="chip" id="streakChip">🔥 連続 0日</span>
      <span class="chip" id="bonusChip">ボーナス ×1.0</span>
      <span class="chip" id="totalChip">累計 0 XP</span>
    </div>
  </section>

  <!-- TODAY -->
  <section id="tab-today">
    <h2><span id="todayLabel">今日のクエスト</span><span class="progress-ring" id="todayProg">0 / 0</span></h2>
    <div class="bar" style="margin-top:0"><i id="dayBar"></i></div>
    <div class="bar-label"><span id="dayMsg">クエストの70%以上をクリアすると「達成日」になり連続記録が伸びます</span></div>
    <div id="taskList" style="margin-top:12px"></div>
  </section>

  <!-- STATS -->
  <section id="tab-stats" class="hidden">
    <h2>ステータス</h2>
    <div class="card" id="statCard"></div>
    <div class="grid2" id="kpis"></div>
    <h2>称号</h2>
    <div class="card" id="titleList"></div>
  </section>

  <!-- LOG -->
  <section id="tab-log" class="hidden">
    <h2>過去5週間の記録</h2>
    <div class="card">
      <div class="cal" id="cal"></div>
      <div class="legend">少 <span style="background:#20253f"></span><span style="background:#1f5b45"></span><span style="background:#2b9a6c"></span><span style="background:#5ee0a0"></span> 多</div>
    </div>
    <h2>起床時刻の推移（14日）</h2>
    <div class="card"><svg id="wakeChart" viewBox="0 0 320 140" width="100%" style="display:block"></svg></div>
    <h2>最近の記録</h2>
    <div id="recent"></div>
  </section>

  <!-- SETTINGS -->
  <section id="tab-settings" class="hidden">
    <h2>プロフィール</h2>
    <div class="card form">
      <label>名前<input id="nameInput" maxlength="20"></label>
    </div>

    <h2>クエスト一覧 <button class="btn sm primary" id="addBtn">＋ 追加</button></h2>
    <div class="card" id="editList"></div>

    <div class="card form hidden" id="taskForm">
      <b id="formTitle">クエストを追加</b>
      <div class="row">
        <label style="flex:0 0 70px">アイコン<input id="fIcon" maxlength="4" value="⭐"></label>
        <label>名前<input id="fName" maxlength="24" placeholder="例: 腕立て伏せ"></label>
      </div>
      <div class="row">
        <label>種類
          <select id="fType">
            <option value="check">チェック（やった/やってない）</option>
            <option value="count">回数・量（目標値あり）</option>
            <option value="wake">起床時刻（目標時刻より早く）</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label>能力
          <select id="fCat">
            <option value="str">体力 STR</option>
            <option value="int">知力 INT</option>
            <option value="mnd">精神 MND</option>
            <option value="vit">生活 VIT</option>
          </select>
        </label>
        <label>獲得XP<input id="fXp" type="number" min="1" max="500" value="20"></label>
      </div>
      <div class="row" id="fTargetRow">
        <label>目標値<input id="fTarget" type="number" min="1" value="30"></label>
        <label>単位<input id="fUnit" maxlength="8" value="回"></label>
      </div>
      <div class="row hidden" id="fWakeRow">
        <label>目標起床時刻<input id="fWake" type="time" value="06:00"></label>
      </div>
      <div class="row">
        <button class="btn" id="cancelBtn">キャンセル</button>
        <button class="btn primary" id="saveBtn">保存</button>
      </div>
    </div>

    <h2>データ</h2>
    <div class="card row" style="flex-wrap:wrap">
      <button class="btn" id="exportBtn">エクスポート</button>
      <button class="btn" id="importBtn">インポート</button>
      <button class="btn danger" id="resetBtn">全リセット</button>
      <input type="file" id="importFile" accept="application/json" class="hidden">
    </div>
    <p class="muted">データはこの端末のブラウザ内に保存されます。日付の切り替えは午前3時です。</p>
  </section>
</div>

<nav><div class="in">
  <button data-tab="today" class="on"><span class="i">⚔️</span>クエスト</button>
  <button data-tab="stats"><span class="i">📊</span>ステータス</button>
  <button data-tab="log"><span class="i">📅</span>記録</button>
  <button data-tab="settings"><span class="i">⚙️</span>設定</button>
</div></nav>

<div class="modal hidden" id="lvModal">
  <div class="box">
    <div style="letter-spacing:.3em;color:var(--muted)">LEVEL UP!</div>
    <div class="big" id="lvModalNum">2</div>
    <div id="lvModalTitle" style="margin:6px 0 18px"></div>
    <button class="btn primary" id="lvModalClose" style="width:100%">続ける</button>
  </div>
</div>

<script>
(() => {
  'use strict';
  const KEY = 'lifeQuest.v1';
  const DAY_START_HOUR = 3;      // 午前3時までは前日扱い
  const CLEAR_RATIO = 0.7;       // 達成日の基準
  const CATS = {
    str: { name: '体力', en: 'STR', color: 'var(--str)' },
    int: { name: '知力', en: 'INT', color: 'var(--int)' },
    mnd: { name: '精神', en: 'MND', color: 'var(--mnd)' },
    vit: { name: '生活', en: 'VIT', color: 'var(--vit)' },
  };
  const TITLES = [
    [1, '見習い'], [3, '駆け出しの冒険者'], [5, '規律の挑戦者'], [8, '鍛錬の戦士'],
    [12, '習慣の騎士'], [16, '鋼の意志'], [20, '自己の支配者'], [25, '覚醒者'],
    [30, '英雄'], [40, '伝説'], [50, '人生の到達者'],
  ];
  const DEFAULT_TASKS = [
    { icon: '🌅', name: '早起き', type: 'wake', cat: 'vit', xp: 30, wake: '06:00' },
    { icon: '💪', name: '腕立て伏せ', type: 'count', cat: 'str', xp: 20, target: 30, unit: '回' },
    { icon: '🏃', name: 'ランニング/ウォーキング', type: 'count', cat: 'str', xp: 30, target: 20, unit: '分' },
    { icon: '💧', name: '水を飲む', type: 'count', cat: 'vit', xp: 10, target: 2, unit: 'L' },
    { icon: '📚', name: '読書', type: 'count', cat: 'int', xp: 20, target: 20, unit: 'ページ' },
    { icon: '🧘', name: '瞑想', type: 'count', cat: 'mnd', xp: 15, target: 10, unit: '分' },
    { icon: '📵', name: '寝る前1時間スマホを見ない', type: 'check', cat: 'mnd', xp: 20 },
    { icon: '🧹', name: '部屋を片付ける', type: 'check', cat: 'vit', xp: 10 },
  ];

  // ---------- state ----------
  const uid = () => Math.random().toString(36).slice(2, 10);
  function freshState() {
    return { name: '冒険者', tasks: DEFAULT_TASKS.map(t => ({ id: uid(), ...t })), log: {}, lastLevel: 1 };
  }
  function load() {
    try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.tasks)) return s; } catch (e) {}
    return freshState();
  }
  let state = load();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  // ---------- dates ----------
  const pad = n => String(n).padStart(2, '0');
  const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  function todayKey() { const d = new Date(); d.setHours(d.getHours() - DAY_START_HOUR); return keyOf(d); }
  function parseKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
  function addDays(k, n) { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); }
  const toMin = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; };

  // ---------- scoring ----------
  // 0..1 の達成度を返す
  function completion(task, v) {
    if (v == null || v === '' || v === false) return 0;
    if (task.type === 'check') return v ? 1 : 0;
    if (task.type === 'count') return Math.max(0, Math.min(1, Number(v) / (task.target || 1)));
    if (task.type === 'wake') {
      const diff = toMin(v) - toMin(task.wake);   // マイナス = 早起き
      if (diff <= 0) return 1;
      if (diff <= 30) return 0.5;                 // 30分以内の遅れは半分
      return 0;
    }
    return 0;
  }
  const isDone = (task, v) => completion(task, v) >= 1;
  const bonusFor = streak => Math.min(1.5, 1 + streak * 0.05);  // 連続1日ごとに+5%（最大1.5倍）

  // 全ログから XP・連続記録・能力値を再計算（タスクを後から編集しても整合する）
  function compute() {
    const tKey = todayKey();
    const days = Object.keys(state.log).sort();
    const byId = Object.fromEntries(state.tasks.map(t => [t.id, t]));
    const cat = { str: 0, int: 0, mnd: 0, vit: 0 };
    const perDay = {};
    let total = 0, streak = 0, best = 0, prev = null, clearedDays = 0;

    for (const k of days) {
      if (k > tKey) continue;
      if (prev && addDays(prev, 1) !== k) streak = 0;      // 空白日で途切れる
      const entries = state.log[k] || {};
      const mult = bonusFor(streak);
      let dayXp = 0, done = 0, count = 0;
      for (const id in entries) {
        const t = byId[id]; if (!t) continue;
        const c = completion(t, entries[id]);
        const g = Math.round(t.xp * c * mult);
        dayXp += g; cat[t.cat] += g; if (c >= 1) done++;
      }
      count = state.tasks.length;
      const cleared = count > 0 && done / count >= CLEAR_RATIO;
      perDay[k] = { xp: dayXp, done, count, cleared, mult };
      total += dayXp;
      if (cleared) { streak++; clearedDays++; best = Math.max(best, streak); }
      else if (k !== tKey) streak = 0;                     // 今日は途中なのでリセットしない
      prev = k;
    }
    // 昨日も今日も未記録なら連続は途切れている
    const y = addDays(tKey, -1);
    if (!(perDay[tKey]?.cleared) && !(perDay[y]?.cleared)) streak = 0;
    return { total, cat, perDay, streak, best, clearedDays, mult: perDay[tKey]?.mult ?? bonusFor(streak) };
  }

  // Lv n → n+1 に必要なXP
  const need = lv => Math.round(80 * Math.pow(lv, 1.35));
  function levelOf(xp) {
    let lv = 1, rest = xp;
    while (rest >= need(lv)) { rest -= need(lv); lv++; }
    return { lv, rest, need: need(lv) };
  }
  const titleOf = lv => TITLES.filter(t => lv >= t[0]).pop()[1];

  // ---------- render ----------
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function render() {
    const c = compute();
    const L = levelOf(c.total);
    $('lvNum').textContent = L.lv;
    $('titleTxt').textContent = titleOf(L.lv);
    $('heroName').textContent = state.name;
    $('xpBar').style.width = (L.rest / L.need * 100) + '%';
    $('xpTxt').textContent = `${L.rest} / ${L.need} XP`;
    $('xpNext').textContent = `次のレベルまで ${L.need - L.rest}`;
    $('streakChip').textContent = `🔥 連続 ${c.streak}日`;
    $('bonusChip').textContent = `ボーナス ×${c.mult.toFixed(2)}`;
    $('totalChip').textContent = `累計 ${c.total.toLocaleString()} XP`;

    renderToday(c);
    renderStats(c, L);
    renderLog(c);
    renderSettings();

    if (L.lv > (state.lastLevel || 1)) {
      $('lvModalNum').textContent = L.lv;
      $('lvModalTitle').textContent = `称号：${titleOf(L.lv)}`;
      $('lvModal').classList.remove('hidden');
    }
    if (L.lv !== state.lastLevel) { state.lastLevel = L.lv; save(); }
  }

  function renderToday(c) {
    const k = todayKey();
    const d = parseKey(k);
    $('todayLabel').textContent = `今日のクエスト（${d.getMonth() + 1}/${d.getDate()} ${'日月火水木金土'[d.getDay()]}）`;
    const entries = state.log[k] || {};
    const day = c.perDay[k] || { done: 0, count: state.tasks.length, xp: 0 };
    const count = state.tasks.length;
    $('todayProg').innerHTML = `${day.done} / ${count} クリア · <span class="gain">+${day.xp} XP</span>`;
    const ratio = count ? day.done / count : 0;
    $('dayBar').style.width = Math.min(100, ratio / CLEAR_RATIO * 100) + '%';
    $('dayMsg').textContent = day.cleared
      ? '🎉 本日は達成日！ 連続記録が伸びました。残りもこなしてXPを稼ごう'
      : `あと ${Math.max(0, Math.ceil(count * CLEAR_RATIO) - day.done)} 個クリアで「達成日」（連続記録＋ボーナス）`;

    const list = $('taskList');
    if (!count) { list.innerHTML = '<p class="muted">設定からクエストを追加しましょう。</p>'; return; }
    list.innerHTML = state.tasks.map(t => {
      const v = entries[t.id];
      const comp = completion(t, v);
      const gain = Math.round(t.xp * comp * c.mult);
      const cat = CATS[t.cat];
      let meta, ctrl;
      if (t.type === 'check') {
        meta = `${t.xp} XP`;
        ctrl = `<button class="check" data-act="toggle" data-id="${t.id}" aria-label="完了">${v ? '✓' : ''}</button>`;
      } else if (t.type === 'count') {
        meta = `目標 ${t.target}${esc(t.unit || '')} · ${t.xp} XP`;
        ctrl = `<input type="number" inputmode="decimal" min="0" step="any" data-act="count" data-id="${t.id}" value="${v ?? ''}" placeholder="0"><span class="muted">${esc(t.unit || '')}</span>
                <button class="check" data-act="fill" data-id="${t.id}" aria-label="目標達成">${isDone(t, v) ? '✓' : ''}</button>`;
      } else {
        meta = `${t.wake} までに起床 · ${t.xp} XP（30分以内の遅れは半分）`;
        ctrl = `<input type="time" data-act="wake" data-id="${t.id}" value="${v ?? ''}">
                <button class="check" data-act="now" data-id="${t.id}" aria-label="今起きた" title="今の時刻で記録">${v ? (comp >= 1 ? '✓' : comp > 0 ? '△' : '✗') : '⏰'}</button>`;
      }
      return `<div class="task ${comp >= 1 ? 'done' : ''}">
        <div class="ic">${esc(t.icon)}</div>
        <div class="body">
          <div class="tn">${esc(t.name)}</div>
          <div class="meta"><span class="tag t-${t.cat}">${cat.en}</span>${meta}${gain ? ` · <span class="gain">+${gain}</span>` : ''}</div>
        </div>
        <div class="ctrl">${ctrl}</div>
      </div>`;
    }).join('');
  }

  function renderStats(c, L) {
    const max = Math.max(100, ...Object.values(c.cat));
    $('statCard').innerHTML = Object.entries(CATS).map(([k, v]) => {
      const pts = Math.floor(c.cat[k] / 10);  // 10XP = 1ポイント
      return `<div class="stat"><div><b>${v.en}</b> <span class="muted">${v.name}</span></div>
        <div class="sbar"><i style="width:${c.cat[k] / max * 100}%;background:${v.color}"></i></div>
        <div class="sv">${pts}</div></div>`;
    }).join('');
    const days = Object.keys(c.perDay).length;
    $('kpis').innerHTML = [
      ['現在の連続記録', `${c.streak}日`], ['最長連続記録', `${c.best}日`],
      ['達成日 合計', `${c.clearedDays}日`], ['記録した日', `${days}日`],
    ].map(([k, v]) => `<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
    $('titleList').innerHTML = TITLES.map(([lv, name]) =>
      `<div style="display:flex;justify-content:space-between;padding:4px 0;${L.lv >= lv ? '' : 'opacity:.35'}">
        <span>${L.lv >= lv ? '🏅' : '🔒'} ${name}</span><span class="muted">Lv ${lv}</span></div>`).join('');
  }

  function renderLog(c) {
    const t = todayKey();
    const td = parseKey(t);
    const end = addDays(t, 6 - td.getDay());      // 今週の土曜まで
    const start = addDays(end, -34);
    let html = '日月火水木金土'.split('').map(w => `<div class="h">${w}</div>`).join('');
    for (let i = 0; i < 35; i++) {
      const k = addDays(start, i);
      const p = c.perDay[k];
      let bg = '#20253f';
      if (p) {
        const r = p.count ? p.done / p.count : 0;
        bg = p.cleared ? (r >= 1 ? '#5ee0a0' : '#2b9a6c') : (p.done ? '#1f5b45' : '#20253f');
      }
      const future = k > t;
      const day = parseKey(k).getDate();
      html += `<div class="d" title="${k}${p ? ` ${p.done}/${p.count} +${p.xp}XP` : ''}"
        style="background:${bg};${future ? 'opacity:.25;' : ''}${k === t ? 'outline:2px solid var(--accent);' : ''}${p?.cleared ? 'color:#0b2a1d;font-weight:700' : ''}">${day}</div>`;
    }
    $('cal').innerHTML = html;

    // 起床時刻チャート
    const wakeTask = state.tasks.find(x => x.type === 'wake');
    const svg = $('wakeChart');
    if (!wakeTask) { svg.innerHTML = '<text x="160" y="70" fill="#8d93b8" font-size="12" text-anchor="middle">起床クエストがありません</text>'; }
    else {
      const pts = [];
      for (let i = 13; i >= 0; i--) {
        const k = addDays(t, -i);
        const v = state.log[k]?.[wakeTask.id];
        pts.push({ k, m: v ? toMin(v) : null });
      }
      const goal = toMin(wakeTask.wake);
      const vals = pts.filter(p => p.m != null).map(p => p.m).concat(goal);
      const lo = Math.floor((Math.min(...vals) - 30) / 60) * 60, hi = Math.ceil((Math.max(...vals) + 30) / 60) * 60;
      const X = i => 30 + i * (280 / 13), Y = m => 10 + (m - lo) / (hi - lo) * 110;
      let s = '';
      const step = hi - lo > 360 ? 120 : 60;
      for (let h = lo; h <= hi; h += step) s += `<line x1="30" x2="310" y1="${Y(h)}" y2="${Y(h)}" stroke="#2c3256"/><text x="24" y="${Y(h) + 4}" fill="#8d93b8" font-size="10" text-anchor="end">${h / 60}時</text>`;
      s += `<line x1="30" x2="310" y1="${Y(goal)}" y2="${Y(goal)}" stroke="#ffcc4d" stroke-dasharray="4 3"/><text x="310" y="${Y(goal) - 3}" fill="#ffcc4d" font-size="9" text-anchor="end">目標 ${wakeTask.wake}</text>`;
      const seg = pts.map((p, i) => p.m == null ? null : `${X(i)},${Y(p.m)}`);
      let path = '', pen = false;
      seg.forEach(q => { if (!q) { pen = false; return; } path += (pen ? 'L' : 'M') + q; pen = true; });
      if (path) s += `<path d="${path}" fill="none" stroke="#5ee0a0" stroke-width="2"/>`;
      pts.forEach((p, i) => { if (p.m != null) s += `<circle cx="${X(i)}" cy="${Y(p.m)}" r="3.5" fill="${p.m <= goal ? '#5ee0a0' : '#ff6b6b'}"><title>${p.k} ${Math.floor(p.m / 60)}:${pad(p.m % 60)}</title></circle>`; });
      s += `<text x="30" y="136" fill="#8d93b8" font-size="9">${pts[0].k.slice(5)}</text><text x="310" y="136" fill="#8d93b8" font-size="9" text-anchor="end">今日</text>`;
      svg.innerHTML = s;
    }

    const recent = Object.keys(c.perDay).sort().reverse().slice(0, 7);
    $('recent').innerHTML = recent.length ? recent.map(k => {
      const p = c.perDay[k];
      return `<div class="card" style="display:flex;justify-content:space-between;padding:10px 14px;margin-bottom:6px">
        <span>${p.cleared ? '🏆' : '・'} ${k.slice(5).replace('-', '/')}</span>
        <span class="muted">${p.done}/${p.count} クリア</span><span class="gain">+${p.xp} XP</span></div>`;
    }).join('') : '<p class="muted">まだ記録がありません。今日のクエストから始めよう！</p>';
  }

  function renderSettings() {
    if (document.activeElement !== $('nameInput')) $('nameInput').value = state.name;
    $('editList').innerHTML = state.tasks.map((t, i) => `<div class="edit-row">
      <span style="font-size:20px">${esc(t.icon)}</span>
      <span class="tn">${esc(t.name)} <span class="tag t-${t.cat}">${CATS[t.cat].en}</span><span class="muted">${t.xp}XP</span></span>
      <button class="btn sm" data-act="up" data-i="${i}" ${i === 0 ? 'disabled' : ''}>↑</button>
      <button class="btn sm" data-act="edit" data-i="${i}">編集</button>
      <button class="btn sm danger" data-act="del" data-i="${i}">削除</button>
    </div>`).join('') || '<p class="muted">クエストがありません</p>';
  }

  // ---------- actions ----------
  function setEntry(id, v) {
    const k = todayKey();
    const t = state.tasks.find(x => x.id === id);
    const before = compute().total;
    state.log[k] = state.log[k] || {};
    if (v === null || v === '' || v === false) delete state.log[k][id]; else state.log[k][id] = v;
    if (!Object.keys(state.log[k]).length) delete state.log[k];
    save();
    const diff = compute().total - before;
    if (diff > 0) toast(`${t.icon} +${diff} XP`);
    render();
  }
  function toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast'; el.textContent = msg;
    document.body.appendChild(el); setTimeout(() => el.remove(), 1500);
  }

  $('taskList').addEventListener('click', e => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const id = b.dataset.id, t = state.tasks.find(x => x.id === id);
    const cur = (state.log[todayKey()] || {})[id];
    if (b.dataset.act === 'toggle') setEntry(id, !cur);
    if (b.dataset.act === 'fill') setEntry(id, isDone(t, cur) ? null : t.target);
    if (b.dataset.act === 'now') {
      if (cur) setEntry(id, null);
      else { const d = new Date(); setEntry(id, `${pad(d.getHours())}:${pad(d.getMinutes())}`); }
    }
  });
  $('taskList').addEventListener('change', e => {
    const el = e.target; if (!el.dataset.act) return;
    if (el.dataset.act === 'count') setEntry(el.dataset.id, el.value === '' ? null : Number(el.value));
    if (el.dataset.act === 'wake') setEntry(el.dataset.id, el.value || null);
  });

  // tabs
  document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
    ['today', 'stats', 'log', 'settings'].forEach(n => $('tab-' + n).classList.toggle('hidden', n !== b.dataset.tab));
    window.scrollTo(0, 0);
  }));

  $('lvModalClose').addEventListener('click', () => $('lvModal').classList.add('hidden'));
  $('nameInput').addEventListener('input', e => { state.name = e.target.value.trim() || '冒険者'; save(); $('heroName').textContent = state.name; });

  // task editor
  let editing = -1;
  function openForm(i) {
    editing = i;
    const t = i >= 0 ? state.tasks[i] : { icon: '⭐', name: '', type: 'check', cat: 'str', xp: 20, target: 30, unit: '回', wake: '06:00' };
    $('formTitle').textContent = i >= 0 ? 'クエストを編集' : 'クエストを追加';
    $('fIcon').value = t.icon; $('fName').value = t.name; $('fType').value = t.type; $('fCat').value = t.cat;
    $('fXp').value = t.xp; $('fTarget').value = t.target ?? 30; $('fUnit').value = t.unit ?? '回'; $('fWake').value = t.wake ?? '06:00';
    syncForm();
    $('taskForm').classList.remove('hidden');
    $('taskForm').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function syncForm() {
    $('fTargetRow').classList.toggle('hidden', $('fType').value !== 'count');
    $('fWakeRow').classList.toggle('hidden', $('fType').value !== 'wake');
  }
  $('fType').addEventListener('change', syncForm);
  $('addBtn').addEventListener('click', () => openForm(-1));
  $('cancelBtn').addEventListener('click', () => $('taskForm').classList.add('hidden'));
  $('saveBtn').addEventListener('click', () => {
    const name = $('fName').value.trim();
    if (!name) { $('fName').focus(); return; }
    const t = {
      id: editing >= 0 ? state.tasks[editing].id : uid(),
      icon: $('fIcon').value.trim() || '⭐', name, type: $('fType').value, cat: $('fCat').value,
      xp: Math.max(1, Math.min(500, Number($('fXp').value) || 10)),
    };
    if (t.type === 'count') { t.target = Math.max(0.1, Number($('fTarget').value) || 1); t.unit = $('fUnit').value.trim(); }
    if (t.type === 'wake') t.wake = $('fWake').value || '06:00';
    if (editing >= 0) state.tasks[editing] = t; else state.tasks.push(t);
    save(); $('taskForm').classList.add('hidden'); render();
  });
  $('editList').addEventListener('click', e => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const i = Number(b.dataset.i);
    if (b.dataset.act === 'edit') openForm(i);
    if (b.dataset.act === 'up' && i > 0) { [state.tasks[i - 1], state.tasks[i]] = [state.tasks[i], state.tasks[i - 1]]; save(); render(); }
    if (b.dataset.act === 'del' && confirm(`「${state.tasks[i].name}」を削除しますか？\n（このクエストで得たXPも消えます）`)) {
      state.tasks.splice(i, 1); save(); render();
    }
  });

  // data
  $('exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `life-quest-${todayKey()}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  $('importBtn').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const s = JSON.parse(await f.text());
      if (!Array.isArray(s.tasks) || typeof s.log !== 'object') throw 0;
      state = s; save(); render(); toast('インポートしました');
    } catch (err) { alert('ファイルを読み込めませんでした'); }
    e.target.value = '';
  });
  $('resetBtn').addEventListener('click', () => {
    if (confirm('すべての記録とクエストを初期状態に戻します。よろしいですか？')) { state = freshState(); save(); render(); }
  });

  // 日付が変わったら再描画
  let lastKey = todayKey();
  setInterval(() => { if (todayKey() !== lastKey) { lastKey = todayKey(); render(); } }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

  // 初回はレベルアップ演出を出さない
  state.lastLevel = state.lastLevel || levelOf(compute().total).lv;
  save();
  render();
})();
</script>
</body>
</html>
