<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="毎日の習慣をクエストに。運動・早起きでレベルを上げる生活RPG">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life Quest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>Life Quest</title>
</head>
<body>

<!-- 上のバー（表示 ＋ 右のアイコンボタン） -->
<header class="top">
  <div class="top-in">
    <div class="avatar" id="avatar"><span class="lvbadge" id="lvNum">1</span></div>
    <div class="who">
      <div class="name" id="heroName">冒険者</div>
      <div class="meter xp"><i id="xpBar"></i><span id="xpTxt">0/80</span></div>
      <div class="meter hp"><i id="hpBar"></i><span id="hpTxt">HP 100</span></div>
    </div>
    <div class="top-btns">
      <button class="ibtn" id="bagBtn" aria-label="持ち物"><span id="bagIcon"></span></button>
      <button class="ibtn" id="mailBtn" aria-label="お知らせ"><span id="mailIcon"></span><span class="badge hidden" id="mailBadge">0</span></button>
      <button class="ibtn" id="helpBtn" aria-label="ルール">？</button>
    </div>
  </div>
  <div class="pills">
    <span class="pill">🔥<b id="streakNum">0</b>日 <span class="y">×<b id="multNum">1.00</b></span></span>
    <span class="pill ice">❄<b id="freezeNum">0</b></span>
    <span class="pill coin"><span id="coinIcon"></span><b id="goldNum">0</b></span>
    <span class="pill gemp"><span id="gemIcon"></span><b id="gemNum">0</b></span>
  </div>
</header>

<main class="wrap">
  <!-- クエスト -->
  <section id="tab-today">
    <button class="event-bar" id="eventBar"></button>
    <div class="card stage-card" id="bossCard"></div>
    <div class="card">
      <div class="card-h"><span>今日のクエスト <span class="prog" id="todayProg">0/0</span></span><button class="btn sm gray" id="retroBtn">昨日の記録</button></div>
      <div id="taskList"></div>
      <div class="dayline" id="dayLine"></div>
    </div>
    <div class="card" id="goalCard"></div>
  </section>

  <!-- ステータス -->
  <section id="tab-stats" class="hidden">
    <div class="card">
      <div class="hero-big"><div id="heroBig"></div>
        <div class="grow"><div class="name" id="heroName2"></div><div class="dim" id="titleTxt"></div>
          <div class="row mt8" style="gap:8px"><button class="btn sm blue" id="titlesBtn">称号</button><button class="btn sm blue" id="achBtn">実績</button><button class="btn sm blue" id="lookBtn">見た目</button></div></div></div>
      <div class="card-h mt12"><span>装備</span><button class="btn sm" id="equipBtn">装備を変更</button></div>
      <div id="equipList"></div>
    </div>
    <div class="card" id="petCard"></div>
    <div class="card"><div class="card-h"><span>能力</span></div><div id="statList"></div></div>
    <div class="card"><div class="kpis" id="kpis"></div></div>
  </section>

  <!-- ショップ -->
  <section id="tab-shop" class="hidden">
    <div class="card shop-top"><div id="shopHero"></div>
      <div class="grow"><div class="gold-big"><span id="coinIcon2"></span><b id="shopGold">0</b>G</div>
        <div class="gem-big"><span id="gemIcon2"></span><b id="shopGems">0</b></div>
        <div class="shop-stats" id="shopStats"></div><div class="mt8" id="tryNote"></div></div></div>
    <div class="seg" id="shopTabs"></div>
    <div id="shopList"></div>
  </section>

  <!-- 記録 -->
  <section id="tab-log" class="hidden">
    <div class="card"><div class="card-h"><span>5週間の記録</span></div><div class="cal" id="cal"></div><div class="legend" id="legend"></div></div>
    <div class="card"><div class="card-h"><span>魔物図鑑</span><span class="dim" id="dexCount"></span></div><div class="dex" id="dex"></div>
      <div class="card-h mt12"><span>イベントボス</span></div><div class="dex" id="evDex"></div></div>
    <div class="card"><div class="card-h"><span>起床時刻（14日間）</span></div><svg id="wakeChart" viewBox="0 0 320 140" width="100%" style="display:block"></svg></div>
  </section>

  <!-- メニュー -->
  <section id="tab-menu" class="hidden">
    <div class="menu" id="menuList"></div>
  </section>
</main>

<nav class="tabs"><div class="in">
  <button data-tab="today" class="on"><span class="ti" data-icon="sword"></span>クエスト</button>
  <button data-tab="stats"><span class="ti" data-icon="shield"></span>ステータス</button>
  <button data-tab="shop"><span class="ti" data-icon="coin"></span>ショップ</button>
  <button data-tab="log"><span class="ti" data-icon="book"></span>記録</button>
  <button data-tab="menu"><span class="ti" data-icon="gear"></span>メニュー</button>
</div></nav>

<!-- 小窓 -->
<div class="sheet hidden" id="sheet">
  <div class="sheet-box">
    <div class="sheet-h"><span id="sheetTitle"></span><button class="btn sm close" id="sheetClose" aria-label="閉じる">✕</button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="modal hidden" id="lvModal"><div class="sheet-box center">
  <div class="lvtitle">LEVEL UP!</div>
  <div id="lvHero"></div>
  <div class="lvnum">Lv <span id="lvModalNum">2</span></div>
  <div id="lvModalInfo"></div>
  <div class="row mt12"><button class="btn blue" id="lvShare">Xでシェア</button><button class="btn" id="lvClose">続ける</button></div>
</div></div>

<div class="say hidden" id="say"></div>
<div class="tut hidden" id="tut"><div class="tut-hole" id="tutHole"></div><div class="tut-box" id="tutBox"></div></div>
<div class="gacha hidden" id="gacha"><div class="gacha-in" id="gachaBox"></div></div>
<div class="flash hidden" id="flash"></div>
<div class="ob hidden" id="ob"><div class="ob-in" id="obBox"></div></div>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">

<script src="js/sprites.js"></script>
<script src="js/catalog.js"></script>
<script src="js/gear.js"></script>
<script src="js/pets.js"></script>
<script src="js/events.js"></script>
<script src="js/app.js"></script>
</body>
</html>
